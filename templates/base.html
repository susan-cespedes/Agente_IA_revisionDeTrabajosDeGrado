<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Revisor de trabajos de grado{% endblock %} · UCB</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #f5f6f8; color: #1d2330; }
        .barra { display: flex; justify-content: space-between; align-items: center;
                 padding: 12px 24px; background: #1f4e8c; color: #fff; }
        .barra form { margin: 0; }
        .barra button { background: none; border: 0; color: #fff; text-decoration: underline; cursor: pointer; font: inherit; }
        .contenido { max-width: 720px; margin: 40px auto; padding: 0 16px; }
        .tarjeta { background: #fff; border: 1px solid #d9dde5; border-radius: 8px; padding: 24px;
                   text-align: center; margin-bottom: 24px; }
        .tarjeta h1 { overflow-wrap: anywhere; }
        .boton { display: inline-block; padding: 10px 18px; background: #1f4e8c; color: #fff;
                 border-radius: 6px; text-decoration: none; border: 0; cursor: pointer; font: inherit; margin-top: 16px; }
        .boton.secundario { background: #5b6475; }
        .aviso { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; background: #e8eef8; }
        .aviso-error { background: #fbe9e9; }
        .aviso-success { background: #e6f4ea; }
        .aviso-warning { background: #fff4e5; }
        label { display: block; margin: 16px 0 6px; font-weight: 500; text-align: left; }
        input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d9dde5; border-radius: 6px; font: inherit; }
        .error { color: #b3261e; text-align: left; margin: 6px 0 0; }
        .resultado { text-align: left; }
        .resultado h2 { margin-top: 0; overflow-wrap: anywhere; }
        .secciones { list-style: none; padding: 0; }
        .secciones li { padding: 2px 0; }
        .secciones .nivel-2 { padding-left: 20px; }
        .secciones .nivel-3 { padding-left: 40px; }
        .secciones .nivel-4, .secciones .nivel-5, .secciones .nivel-6 { padding-left: 60px; }
        details summary { cursor: pointer; font-weight: 500; margin-top: 16px; }
        .texto-leido { white-space: pre-wrap; background: #f5f6f8; padding: 12px; border-radius: 6px;
                       max-height: 400px; overflow-y: auto; font-size: 0.85rem; }
    </style>
</head>
<body>
<header class="barra">
    <strong>Revisor de trabajos de grado</strong>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'usuarios:salir' %}">
        {% csrf_token %}
        <span>{{ user.email }}</span> · <button type="submit">Salir</button>
    </form>
    {% endif %}
</header>

<main class="contenido">
    {% for mensaje in messages %}
    <div class="aviso aviso-{{ mensaje.tags }}">{{ mensaje }}</div>
    {% endfor %}
    {% block contenido %}{% endblock %}
</main>
</body>
</html>
